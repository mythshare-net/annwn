rawn_bargain",title:"Arawn's Bargain",body:"For a year and a day Pwyll wore Arawn's shape and held his throne, sharing nothing with the queen of Annwn but a courteous bed. So the friendship of the two kings was forged — and Pwyll earned the name Pen Annwn, Head of the Otherworld, by which he was known thereafter."},{id:"i_hafgan",title:"Hafgan, King at the Ford",body:"Arawn's rival ruled the other half of Annwn and could not be killed by any blow but the first. A second stroke would heal him whole. At year's end Pwyll met him at the ford and gave the one stroke that was needed. Annwn was made one realm under Arawn — and Pwyll went home."}],Ho=[{name:"Eilonwy of the Mist",line:"My lord, the horn never came."},{name:"Idris the Forester",line:"I saw the white pack first — too late, too late."},{name:"Glyn, master of hounds",line:"They had red ears. I should have known."},{name:"Rhiwallon the bard",line:"Sing me home, prince. Sing me home."},{name:"Tegid of Dyfed",line:"The year is almost done, is it not?"},{name:"Mair, milkmaid of Narberth",line:"They say the king wore another's face."},{name:"Cadell the Old",line:"I never crossed the ford. I never crossed the ford."},{name:"Bleddyn the Huntsman",line:"Arawn's pack runs faster than ours."}],bs={schema:Mo,id:To,name:So,title:Ao,branch:Co,tint:Io,palette:Lo,boss:Eo,story:Ro,verse:Po,source:Bo,seed:$o,width:Oo,height:Do,tiles:Wo,entities:Fo,lore:Go,soulPool:Ho},ws=Object.freeze(Object.defineProperty({__proto__:null,boss:Eo,branch:Co,default:bs,entities:Fo,height:Do,id:To,lore:Go,name:So,palette:Lo,schema:Mo,seed:$o,soulPool:Ho,source:Bo,story:Ro,tiles:Wo,tint:Io,title:Ao,verse:Po,width:Oo},Symbol.toStringTag,{value:"Module"})),qo=1,No="branwen-s-hall",Vo="II",Yo="Branwen's Hall — The Second Branch",Uo="Branwen ferch Llŷr",Xo=[44,20,28],zo={wall:[98,72,66],wall2:[110,52,52],floor:[34,22,22],accent:[40,18,18],light:[255,200,150]},Ko={name:"Efnysien · Breaker of the Cauldron",death:"Efnysien shatters the Pair Dadeni from wit anwen, when at last she returned to Wales, looked at the two slaughtered hosts and her heart broke in her breast on the banks of the Alaw."},{id:"ii_pair_dadeni",title:"The Pair Dadeni",body:"The Cauldron of Rebirth was given by Bran to Matholwch in apology. Cast a slain man into it that night and he rises on the morrow whole — but mute, and remembering nothing of who he was. So the Irish fought on past death, and the Welsh could not win, until Efnysien hid among the slain and burst the cauldron with his own heart."},{id:"ii_efnysien",title:"Efnysien",body:"Half-brother to Bran and Branwen, Efnysien's spite began the war: he maimed Matholwch's horses at the wedding feast, and threw Branwen's infant son Gwern into the hall-fire. Yet at the end it was his body alone that broke the cauldron and saved what remained of the Island of the Mighty."}],si=[{name:"Gwern, the child cast to the fire",line:"Mother. Mother."},{name:"Heilyn fab Gwyn",line:"We carried his head to Harlech, and it sang."},{name:"Pryderi, who returned",line:"Seven of us came home. Only seven."},{name:"Manawydan fab Llŷr",line:"My brother's wound would not close."},{name:"Taliesin, before he was a bard",line:"At Gwales we forgot a long time."},{name:"A drummer of Matholwch",line:"I died in Ireland. I rose without tongue."},{name:"Branwen's starling",line:"Across the sea, across the sea."},{name:"Ynawg of the Seven",line:"Do not open the door to Cornwall."}],xs={schema:qo,id:No,name:Vo,title:Yo,branch:Uo,tint:Xo,palette:zo,boss:Ko,story:jo,verse:Jo,source:Qo,seed:Zo,width:ei,height:ti,tiles:ni,entities:oi,lore:ii,soulPool:si},_s=Object.freeze(Object.defineProperty({__proto__:null,boss:Ko,branch:Uo,default:xs,entities:oi,height:ti,id:No,lore:ii,name:Vo,palette:zo,schema:qo,seed:Zo,soulPool:si,source:Qo,story:jo,tiles:ni,tint:Xo,title:Yo,verse:Jo,width:ei},Symbol.toStringTag,{value:"Module"})),ai=1,ri="the-mist-of-dyfed",li="III",hi="The Mist of Dyfed — The Third Branch",ci="Manawydan fab Llŷr",di=[22,30,4 h town he was driven out — and so returned to ruined Dyfed."},{id:"iii_rhiannon_pryderi",title:"Rhiannon and Pryderi",body:"Pryderi laid hand on a golden bowl chained to a slab and could neither speak nor let go. Rhiannon, his mother — once accused of devouring her own child, once made to bear guests on her back like a horse — came to free him, and was taken by the same enchantment. Both vanished into Llwyd's caer."},{id:"iii_llwyd",title:"Llwyd ap Cil Coed",body:"The enchanter Llwyd cast the mist upon Dyfed in vengeance for the humiliation of his friend Gwawl ap Clud — whom Pwyll had once tricked at Rhiannon's bridal feast, beating him inside a magical bag. Llwyd's mouse-host devoured Manawydan's wheat, and only by catching the queen-mouse did Manawydan win Dyfed back."}],ki=[{name:"Cigfa, daughter of Gwynn Glôyw",line:"He took Pryderi at the bowl. Don't touch it."},{name:"A craftsman of Hereford",line:"His saddles were too fine, too fine."},{name:"A mouse-shape, given woman's voice",line:"Spare the small one, lord. She is heavy with child."},{name:"Pryderi fab Pwyll",line:"My hand will not come off the bowl."},{name:"Rhiannon, who once bore guests",line:"I have worn a horse's collar before. I can wear it again."},{name:"A shieldwright of Lloegr",line:"They drove us out for the work of our hands."},{name:"Gwawl ap Clud, in the bag",line:"Beaten, beaten, beaten."},{name:"A swineherd of Arberth",line:"The mist took the hogs first."}],vs={schema:ai,id:ri,name:li,title:hi,branch:ci,tint:di,palette:fi,boss:ui,story:yi,verse:mi,source:pi,seed:gi,width:bi,height:wi,tiles:xi,entities:_i,lore:vi,soulPool:ki},ks=Object.freeze(Object.defineProperty({__proto__:null,boss:ui,branch:ci,default:vs,entities:_i,height:wi,id:ri,lore:vi,name:li,palette:fi,schema:ai,seed:gi,soulPool:ki,source:pi,story:yi,tiles:xi,tint:di,title:hi,verse:mi,width:bi},Symbol.toStringTag,{value:"Module"})),Mi=1,Ti="caer-dathyl",Si="IV",Ai="Caer Dathyl — The Fourth Branch",Ci="Math fab Mathonwy",Ii=[36,28,4
